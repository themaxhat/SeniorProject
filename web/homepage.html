<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Welcome · AI Counselor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="home">

  <!-- Same stage as the counselor page, so a saved background carries over -->
  <section id="stage" class="stage" aria-label="Welcome">
    <main class="stage-main" data-user-name="Michael">
      <h1 id="greeting" class="greeting">Hello Michael</h1>

      <a class="orb" href="index.html" aria-label="Begin a conversation">
        <img src="orb.png" alt="" width="300" height="300" draggable="false">
      </a>

      <p class="home-lead">Talk or type whenever you’re ready.</p>
      <a class="home-start" href="index.html">Begin</a>
    </main>

    <footer class="stage-foot">
      <p>Your chats and recordings are saved on this device only. This isn’t a substitute for professional or emergency care.
        <a href="https://988lifeline.org" target="_blank" rel="noopener">Need urgent help? Call or text 988 (US)</a></p>
    </footer>
  </section>

  <script src="ui.js"></script>
</body>
</html>
