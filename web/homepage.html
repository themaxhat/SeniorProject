<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --text: #1f2328;
    --muted: #8a8f98;
    --border: #e4e4e0;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    --accent: #3b5bdb;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a; --surface: #202225; --text: #ececea;
      --muted: #85898f; --border: #2e3033;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      --accent: #8da2fb;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181a; --surface: #202225; --text: #ececea;
    --muted: #85898f; --border: #2e3033;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --accent: #8da2fb;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  main {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
    margin-bottom: 8vh;
  }

  h1 {
    margin: 0;
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(2rem, 5vw, 2.75rem);
    letter-spacing: -0.015em;
    text-align: center;
  }

  .composer {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 8px 8px 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: var(--shadow);
    transition: border-color .2s ease;
  }
  .composer:focus-within { border-color: var(--accent); }

  .composer input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 1rem;
    padding: 12px 0;
  }
  .composer input::placeholder { color: var(--muted); }

  .mic {
    flex: none;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background .2s ease, color .2s ease;
  }
  .mic:hover { background: var(--bg); color: var(--text); }
  .mic:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mic svg { width: 22px; height: 22px; }
</style>
</head>
<body>
  <main>
    <h1>Welcome, XYZ</h1>
    <div class="composer">
      <input type="text" placeholder="Ask anything" aria-label="Message">
      <button class="mic" type="button" aria-label="Use microphone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="3" width="6" height="12" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0"/>
          <path d="M12 18v3"/>
        </svg>
      </button>
    </div>
  </main>
</body>
</html>
